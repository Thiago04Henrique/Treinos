<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banco Verde</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="imagens/logo.png" type="image/png">

</head>

<body>
    <header>
        <div class="logo-container">
            <img src="imagens/logo.png" alt="thebank-logo">
            <span class="logo-texto">Banco Verde</span>
        </div>
        <nav>
            <ul>
                <li><a href="#">Página Inicial</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Contato</a></li>
                <li><a href="#">Blog</a></li>
                <li><a href="#">Carreira</a></li>
            </ul>

            <a class="btn-cadastre-se" href="#">Cadastre-se</a>
        </nav>
    </header>

    <script>
        const links = document.querySelectorAll('a');

        links.forEach(link => {
            link.addEventListener('click', (event) => {
                event.preventDefault();
                alert("Desculpe, página em manutenção!😓⛔🛠️");
            });
        });
    </script>
</body>

</html>
