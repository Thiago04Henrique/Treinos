<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Imagens</title>
    <link rel="shortcut icon" href="./imagens/palette.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <!-- fontes início -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght,YOPQ@100..900,300&family=Manrope:wght@200..800&family=Public+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <!-- fontes fim -->
</head>

<body>

    <header>
        <h1 class="cabeçalho">GALERIA</h1>
    </header>
    <ul class="galeria">
        <li class="card"><img src="Imagens/Rome.jpg" alt="Rome-card">
            <div class="conteúdo">
                <h2>Rome</h2>
                <p>Michelangelo </p>
            </div>
        </li>

        <li class="card"><img src="Imagens/boat_at_sea.png" alt="Boat_at_Sea-Card">
            <div class="conteúdo">
                <h2>Boat at Sea</h2>
                <p>Vincent Van Gogh</p>
            </div>
        </li>

        <li class="card"><img src="Imagens/Sand_and_sea.png" alt="Sand and Sea-Card">
            <div class="conteúdo">
                <h2>Sand and Sea</h2>
                <p>Da Vinci</p>
            </div>
        </li>

        <li class="card"><img src="Imagens/Starry_Night.png" alt="Starry Night-Card">
            <div class="conteúdo">
                <h2>Starry Night</h2>
                <p>Vincent Van Gogh</p>
            </div>
        </li>
    </ul>


</body>

</html>
